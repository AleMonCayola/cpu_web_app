<div class="view-header">
  <h1>Calculadora Interactiva de Rentabilidad</h1>
</div>

<div class="view-body">
  <section class="card">
    <div class="table-header">
      <h3>Simulador de precios</h3>
      <input type="text" id="calc-buscar" placeholder="🔍 Filtrar producto...">
    </div>
    <table class="data-table">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Paquete</th>
          <th>Precio Paquete</th>
          <th>Costo Unitario</th>
          <th style="width: 150px;">Precio venta (u)</th>
          <th>Ganancia</th>
          <th>Ganancia Total Paquete</th>
        </tr>
      </thead>
      <tbody id="tabla-calculadora">
      </tbody>
    </table>
  </section>
</div>
