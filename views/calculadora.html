<div class="view-header">
  <h1>Calculadora Interactiva de Rentabilidad</h1>
</div>

<div class="view-body">
  <section class="card">
    <div class="table-header">
      <h3>Simulador de precios</h3>
      <!-- Agregamos estilo o clase para limitar el ancho de la búsqueda -->
      <input type="text" id="calc-buscar" placeholder="🔍 Filtrar producto..." style="max-width: 220px;">
    </div>
    
    <!-- Envolvemos la tabla para que en celulares no deforme el diseño -->
    <div class="table-responsive">
      <table class="data-table">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Paquete</th>
            <th>Precio Paquete</th>
            <th>Costo Uni.</th>
            <th style="width: 100px;">Venta</th> <!-- Ajustamos el ancho adecuado -->
            <th>Ganancia</th>
            <th>Ganancia</th>
          </tr>
        </thead>
        <tbody id="tabla-calculadora">
        </tbody>
      </table>
    </div>
  </section>
</div>
