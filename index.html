<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Productos y Calculadora</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Overlay para cerrar el menú en móviles al hacer clic fuera -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <div class="app-container">
    <!-- Barra superior para dispositivos móviles -->
    <header class="mobile-header">
      <button id="mobile-menu-toggle" class="menu-toggle-btn" aria-label="Abrir Menú">☰</button>
      <h2 class="mobile-title">Golosinas App</h2>
    </header>

    <!-- Menú Lateral (Sidebar) -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2>Golosinas App</h2>
        <button id="close-sidebar-btn" class="close-sidebar-btn">&times;</button>
      </div>
      <nav>
        <button id="btn-productos" class="nav-btn active">📦 Productos</button>
        <button id="btn-calculadora" class="nav-btn">🧮 Calculadora</button>
        <button id="btn-imprimir" class="nav-btn">🖨️ Imprimir Lista</button>
      </nav>
    </aside>

    <!-- Área de Contenido Principal -->
    <main id="content-area" class="content">
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/calculadora.js"></script>
  <script src="js/imprimir.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
